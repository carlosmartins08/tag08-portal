databases:
  - name: tag08-postgres
    plan: basic-256mb
    databaseName: tag08
    user: tag08

services:
  - type: web
    name: tag08-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run check
    startCommand: npm start
    healthCheckPath: /api/onboarding/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tag08-postgres
          property: connectionString
      - key: INTEGRATIONS_ENABLED
        value: "false"
      - key: CLICKUP_TALENT_LIST_ID
        value: "900700474161"
      - key: DATABASE_SSL
        value: "false"

  - type: worker
    name: tag08-integrations
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node server/integrationWorker.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tag08-postgres
          property: connectionString
      - key: INTEGRATIONS_ENABLED
        value: "false"
      - key: DATABASE_SSL
        value: "false"

  - type: cron
    name: tag08-integration-sync
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: node server/integrationWorker.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tag08-postgres
          property: connectionString
      - key: INTEGRATIONS_ENABLED
        value: "false"
      - key: DATABASE_SSL
        value: "false"
